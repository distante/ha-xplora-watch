# default_config: pulls in bluetooth/usb/go2rtc/dhcp, none of which this
# devcontainer can satisfy (no BT/USB hardware, no go2rtc docker binary, no
# libpcap) - they only produce setup-failure noise here. Declare the rest of
# default_config's integrations explicitly instead.
cloud:
energy:
# Part of default_config; xplora_watch uses it (an after_dependency) to convert AMR voice messages
# to mp3, so it must be loaded here for that path to work in this explicit-integrations dev config.
ffmpeg:
file:
history:
homeassistant_alerts:
logbook:
media_source:
mobile_app:
my:
ssdp:
stream:
sun:
usage_prediction:
webhook:
zeroconf:

# https://www.home-assistant.io/integrations/homeassistant/
homeassistant:
  debug: true

# https://www.home-assistant.io/integrations/logger/
logger:
  default: info
  logs:
    custom_components.xplora_watch: debug
    # Raw, unparsed GraphQL response envelopes (control mutations + chatsNew). The parent line
    # above already enables this by inheritance, but keep it explicit so the raw dumps survive if
    # the parent is ever dialed back to info. Off by default in production (personal data).
    custom_components.xplora_watch.pyxplora_api.raw: debug
    # libturbojpeg isn't installed in this devcontainer; it only speeds up
    # camera snapshots, an HA core feature xplora_watch doesn't use.
    homeassistant.components.camera.img_util: critical
