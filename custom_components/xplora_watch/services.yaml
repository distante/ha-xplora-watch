      required: true
      selector:
        select:
          options: []
  name: Reboot Watch
refresh_functions:
  description: Refresh alarms, silent times and safe zones from your watch on demand
    (these have a separate, default-off poll interval).
  fields:
    target:
      description: Choose your watch to refresh.
      name: Watch(es)
      required: true
      selector:
        select:
          options:
          - all
    user:
      description: Select the user who should trigger the refresh.
      name: User
      required: true
      selector:
        select:
          options: []
  name: Refresh alarms/silents/safe zones
see:
  description: 'Manually refresh the watch''s live status: location, battery, charging,
    online status and steps (the data from the watch''s device list). Other data has
    its own services and is not refreshed here: chat messages via read_message, and
    location-history archiving via fetch_history. Alarms, silent times and safe zones
    refresh on their own interval or on demand via refresh_functions.'
  fields:
    target:
      description: Choose your watch to update the data.
      name: Watch(es)
      required: true
      selector:
        select:
          options:
          - all
    user:
      description: Select the user who should trigger the tracking.
      name: User
      required: true
      selector:
        select:
          options: []
  name: Track Watch
send_message:
  description: Send a notification.
  fields:
    message:
      description: Notification text of the message.
      name: Message
      required: true
      selector:
