      name: Watch(es)
      required: true
      selector:
        select:
          options:
          - all
    user:
      description: Select the account that owns the watch.
      name: User
      required: true
      selector:
        select:
          options: []
  name: Delete silent time
fetch_history:
  description: 'Fetch and cache a past day''s location history (default: yesterday).
    The watch only serves the last few days, so automate this daily to keep a longer
    history in Home Assistant.'
  fields:
    date:
      description: Day to fetch as YYYY-MM-DD. Defaults to yesterday. Only the last
        few days are available from the watch.
      name: Date
      required: false
      selector:
        text: null
    target:
      description: Choose your watch.
      name: Watch(es)
      required: true
      selector:
        select:
          options:
          - all
    user:
      description: Select the account that owns the watch.
      name: User
      required: true
      selector:
        select:
          options: []
  name: Fetch location history (day)
logout:
  description: 'Log out the account: invalidate the current session token on Xplora''s
    servers and force a fresh login on the next update.'
  fields:
    user:
      description: Select the account to log out.
      name: User
      required: true
      selector:
        select:
          options: []
  name: Log Out
read_message:
  description: Read messages from the watch.
  fields:
    target:
      description: Choose your watch from which to retrieve the message.
      name: Watch(es)
      required: true
      selector:
        select:
          options:
