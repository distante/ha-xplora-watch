# Static service descriptions for hassfest/HACS validation. The integration regenerates this
# file at runtime with the real per-watch target/user dropdown options
# (helper.create_service_yaml_file); do not hand-edit the generated values.
create_alarm:
  description: Create a new alarm on the watch.
  fields:
    name:
      description: Optional alarm label.
      name: Name
      required: false
      selector:
        text: null
    start:
      description: Start time (HH:MM).
      name: Start
      required: true
      selector:
        time: null
    target:
      description: Choose the watch(es) to apply this to.
      name: Watch(es)
      required: true
      selector:
        select:
          options:
          - all
    user:
      description: Select the account that owns the watch.
      name: User
      required: true
      selector:
        select:
          options: []
    weekdays:
      description: Days of the week the entry repeats on.
      name: Repeat days
      required: true
      selector:
        select:
          multiple: true
          options:
          - label: Monday
            value: mon
          - label: Tuesday
            value: tue
          - label: Wednesday
            value: wed
          - label: Thursday
            value: thu
          - label: Friday
            value: fri
          - label: Saturday
            value: sat
          - label: Sunday
            value: sun
  name: Create alarm
create_silent:
  description: Create a new silent-time window on the watch.
  fields:
    end:
      description: End time (HH:MM).
      name: End
      required: true
      selector:
        time: null
    start:
      description: Start time (HH:MM).
      name: Start
      required: true
      selector:
        time: null
    target:
      description: Choose the watch(es) to apply this to.
      name: Watch(es)
      required: true
      selector:
        select:
          options:
          - all
    user:
      description: Select the account that owns the watch.
      name: User
      required: true
      selector:
        select:
          options: []
    weekdays:
      description: Days of the week the entry repeats on.
      name: Repeat days
      required: true
      selector:
        select:
          multiple: true
          options:
          - label: Monday
            value: mon
          - label: Tuesday
            value: tue
          - label: Wednesday
            value: wed
          - label: Thursday
            value: thu
          - label: Friday
            value: fri
          - label: Saturday
            value: sat
          - label: Sunday
            value: sun
  name: Create silent time
delete_alarm:
  description: Delete an alarm from the watch.
  fields:
    alarm_id:
      description: The id of the alarm (see the alarms sensor attributes).
      name: Alarm ID
      required: true
      selector:
        text: null
    target:
      description: Choose the watch(es) to apply this to.
      name: Watch(es)
      required: true
      selector:
        select:
          options:
          - all
    user:
      description: Select the account that owns the watch.
      name: User
      required: true
      selector:
        select:
          options: []
  name: Delete alarm
delete_message_from_app:
  description: Delete message in the Xplora® app.
  fields:
    message_id:
      description: Enter the message ID to be deleted in the app; does not affect
        messages on the watch.
      name: Message ID
      required: true
      selector:
        text: null
    target:
      description: Choose your watch where the message should be deleted.
      name: Watch(es)
      required: true
      selector:
        select:
          options:
          - all
    user:
      description: Select the user who should delete the message on the watch.
      name: User
      required: true
      selector:
        select:
          options: []
  name: Delete Message
delete_silent:
  description: Delete a silent-time window from the watch.
  fields:
    silent_id:
      description: The id of the silent-time window (see the silents sensor attributes).
      name: Silent ID
      required: true
      selector:
        text: null
    target:
