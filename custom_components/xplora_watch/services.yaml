# Static service descriptions. Each service is targeted at the Xplora® watch device(s) via an
# inline `device_id` field whose `device` selector is filtered to `integration: xplora_watch`,
# so the action form shows a watch-only chooser (ADR 0003). The handler resolves the picked
# device(s) -> (account, watch); it also accepts `entity_id` (used by the bundled Lovelace card)
# and `area_id`. This file carries no per-account watch ids / usernames and is not regenerated.
create_alarm:
  description: Create a new alarm on the watch.
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: &id001
        device:
          integration: xplora_watch
          multiple: true
    name:
      description: Optional alarm label.
      name: Name
      required: false
      selector:
        text: null
    start:
      description: Start time (HH:MM).
      name: Start
      required: true
      selector:
        time: null
    weekdays:
      description: Days of the week the entry repeats on.
      name: Repeat days
      required: true
      selector:
        select:
          multiple: true
          options:
          - label: Monday
            value: mon
          - label: Tuesday
            value: tue
          - label: Wednesday
            value: wed
          - label: Thursday
            value: thu
          - label: Friday
            value: fri
          - label: Saturday
            value: sat
          - label: Sunday
            value: sun
  name: Create alarm
create_silent:
  description: Create a new silent-time window on the watch.
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
    end:
      description: End time (HH:MM).
      name: End
      required: true
      selector:
        time: null
    start:
      description: Start time (HH:MM).
      name: Start
      required: true
      selector:
        time: null
    weekdays:
      description: Days of the week the entry repeats on.
      name: Repeat days
      required: true
      selector:
        select:
          multiple: true
          options:
          - label: Monday
            value: mon
          - label: Tuesday
            value: tue
          - label: Wednesday
            value: wed
          - label: Thursday
            value: thu
          - label: Friday
            value: fri
          - label: Saturday
            value: sat
          - label: Sunday
            value: sun
  name: Create silent time
delete_alarm:
  description: Delete an alarm from the watch.
  fields:
    alarm_id:
      description: The id of the alarm (see the alarms sensor attributes).
      name: Alarm ID
      required: true
      selector:
        text: null
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
  name: Delete alarm
delete_message_from_app:
  description: Delete message in the Xplora® app.
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
    message_id:
      description: Enter the message ID to be deleted in the app; does not affect messages on the watch.
      name: Message ID
      required: true
      selector:
        text: null
  name: Delete Message
delete_silent:
  description: Delete a silent-time window from the watch.
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
    silent_id:
      description: The id of the silent-time window (see the silents sensor attributes).
      name: Silent ID
      required: true
      selector:
        text: null
  name: Delete silent time
fetch_history:
  description: 'Fetch and cache a past day''s location history (default: yesterday). The watch only serves
    the last few days, so automate this daily to keep a longer history in Home Assistant.'
  fields:
    date:
      description: Day to fetch as YYYY-MM-DD. Defaults to yesterday. Only the last few days are available
        from the watch.
      name: Date
      required: false
      selector:
        text: null
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
  name: Fetch location history (day)
logout:
  description: 'Log out the account: invalidate the current session token on Xplora''s servers and force
    a fresh login on the next update.'
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
  name: Log Out
read_message:
  description: Read messages from the watch.
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
  name: Read Messages
reboot:
  description: Reboot the watch.
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
  name: Reboot Watch
refresh_functions:
  description: Refresh alarms, silent times and safe zones from your watch on demand (these have a separate,
    default-off poll interval).
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
  name: Refresh alarms/silents/safe zones
see:
  description: 'Manually refresh the watch''s live status: location, battery, charging, online status
    and steps (the data from the watch''s device list). Other data has its own services and is not refreshed
    here: chat messages via read_message, and location-history archiving via fetch_history. Alarms, silent
    times and safe zones refresh on their own interval or on demand via refresh_functions.'
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
  name: Track Watch
send_message:
  description: Send a notification.
  fields:
    device_id:
      description: The Xplora® watch(es) this action applies to.
      name: Watch(es)
      required: true
      selector: *id001
    message:
      description: Notification text of the message.
      name: Message
      required: true
      selector:
