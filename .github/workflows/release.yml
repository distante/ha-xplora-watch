# Drafts a GitHub Release whenever a version tag (v*) is pushed.
#
# HACS installs the latest *published* Release — not the latest tag, and not a
# draft. Pushing a tag stages a DRAFT release seeded with auto-generated notes;
# a maintainer then writes the real release notes and clicks Publish, at which
# point HACS sees the new version. Drafting (rather than auto-publishing) makes
# it structurally impossible to ship empty/auto-only notes to users — the
# release body is this project's changelog. See CONTRIBUTING "Cutting a release".
#
# Notes are generated server-side by the GitHub API from the commits/PRs since
# the previous tag. The built-in GITHUB_TOKEN's `contents: write` is sufficient;
# no extra secrets or third-party actions are needed.
name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Draft release from tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          # Create a DRAFT (no --latest): a maintainer fills in the notes and
          # publishes it manually, so HACS never sees empty auto-only notes.
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --draft \
            --verify-tag
